name: Buildozer Local Docker Step

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build APK using Buildozer Docker
      run: |
        docker run --rm \
          -e BUILDOZER_ALLOW_ROOT=1 \
          -v ${{ github.workspace }}:/home/user/hostworkspace \
          -w /home/user/hostworkspace \
          kivy/buildozer:latest \
          buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: secure-delete-apk
        path: bin/*.apk
