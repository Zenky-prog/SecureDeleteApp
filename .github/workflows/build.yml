name: Dockerized Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    # هنا يتم تحديد صورة الدوكر الجاهزة التي تحتوي على البيئة البرمجية المستدامة بعيداً عن التطبيق
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fix git safe directory (ضروري لصلاحيات الدوكر)
      run: |
        git config --global --add safe.directory /__w/$(echo ${{ github.repository }} | cut -d'/' -f2)/$(echo ${{ github.repository }} | cut -d'/' -f2)

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: secure-delete-apk
        path: bin/*.apk
